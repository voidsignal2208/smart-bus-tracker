name: smart-bus-tracker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      # Uncomment if you switch to the local "postgres" service below
      # postgres:
      #   condition: service_healthy

  # Caches the latest known position per bus (see backend/src/services/CacheService.*)
  # so hot reads don't have to hit Postgres on every request/WS subscribe.
  # Pure cache, deliberately non-persistent (no RDB/AOF, no volume) — every key
  # the app writes has a short TTL and Postgres is always the source of truth,
  # so there's nothing worth surviving a restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./busyatri
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local Postgres, for developing without the hosted Supabase DB.
  # Start it with: docker compose --profile local-db up
  # and point the backend at it by setting DB_HOST=postgres in your .env.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_NAME:-busdb}
      POSTGRES_USER: ${DB_USER:-busapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-busapp} -d ${DB_NAME:-busdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
